name: Insider Trade Watcher

# Kein eingebauter "schedule"-Trigger: der wurde von GitHub bei
# haeufigen Intervallen (< 1 Stunde) unzuverlaessig/verzoegert
# ausgefuehrt. Stattdessen loest ein externer Dienst (cron-job.org)
# praezise alle 15 Minuten workflow_dispatch ueber die GitHub-API aus.
# Zusaetzlich bleibt workflow_dispatch fuer manuelle Testlaeufe nutzbar.
on:
  workflow_dispatch:

# Wird benoetigt, damit der Workflow Dateien zurueck ins Repo pushen darf
permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Script ausfuehren
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Optional. Ohne das Secret ist der Totmannschalter aus.
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: python insider_watch.py

      # Zeitstempel wird bei jedem Lauf geschrieben, aber nur mit
      # committet, wenn sich auch eine Zustandsdatei geaendert hat (siehe
      # naechster Schritt). last_run.txt zeigt also den letzten Lauf MIT
      # Aenderung. Ob ueberhaupt Laeufe stattfinden, zeigen der
      # Actions-Tab und der Totmannschalter (HEALTHCHECK_URL).
      # if: always() -- auch nach einem abgestuerzten Lauf.
      - name: Zeitstempel aktualisieren
        if: always()
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run.txt

      # WICHTIG: hier muessen ALLE Zustandsdateien mit rein. Fehlt eine,
      # faengt der zugehoerige Zaehler bei jedem Lauf wieder bei null an,
      # weil jeder Runner mit einem frischen Checkout startet:
      #   seen_entries.json -- sonst kaemen Doppel-Benachrichtigungen
      #   error_state.json  -- sonst erreicht der Fehlerzaehler nie die
      #                        Schwelle und die Stoerungsmeldung kommt nie
      #   statistik.json    -- sonst haette der Smart-Filter keine
      #                        Historie und die Berichte waeren leer
      #
      # "git add --" mit Dateiliste wuerde abbrechen, falls eine Datei
      # fehlt (z.B. beim allerersten Lauf). Darum -A mit Pathspec: das
      # nimmt vorhandene Dateien mit und ignoriert fehlende still.
      #
      # Committet wird nur, wenn sich eine Zustandsdatei wirklich
      # geaendert hat. Frueher kam durch last_run.txt bei JEDEM Lauf ein
      # Commit dazu, rund 96 am Tag. "git diff --cached --quiet" gibt 0
      # zurueck, wenn nichts vorgemerkt ist -- dann endet der Schritt
      # hier ohne Fehler.
      - name: Aenderungen zurueck ins Repo committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- seen_entries.json error_state.json statistik.json
          if git diff --cached --quiet; then
            echo "Keine Zustandsaenderung, kein Commit"
            exit 0
          fi
          git add -A -- last_run.txt
          git commit -m "Automatischer Lauf: $(date -u)"
          git pull --rebase
          git push
