name: Insider Trade Watcher

# Zeitplan-Trigger (Uhrzeit in UTC!) + manueller Trigger zum Testen
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Wird benoetigt, damit der Workflow Dateien zurueck ins Repo pushen darf
permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Script ausfuehren
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python insider_watch.py

      # Zeitstempel wird IMMER aktualisiert (auch ohne neue Meldungen).
      # Das sorgt dafuer, dass bei jedem Lauf ein Commit entsteht -- und
      # verhindert damit ganz nebenbei, dass GitHub den Zeitplan wegen
      # "60 Tage keine Aktivitaet" automatisch deaktiviert.
      - name: Zeitstempel aktualisieren
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run.txt

      - name: Aenderungen zurueck ins Repo committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_entries.json last_run.txt
          git commit -m "Automatischer Lauf: $(date -u)"
          git push
