name: Insider Trade Watcher

# Kein eingebauter "schedule"-Trigger mehr: der wurde von GitHub bei
# haeufigen Intervallen (< 1 Stunde) unzuverlaessig/verzoegert
# ausgefuehrt. Stattdessen loest ein externer Dienst (cron-job.org)
# praezise alle 20 Minuten workflow_dispatch ueber die GitHub-API aus.
# Zusaetzlich bleibt workflow_dispatch fuer manuelle Testlaeufe nutzbar.
on:
  workflow_dispatch:

# Wird benoetigt, damit der Workflow Dateien zurueck ins Repo pushen darf
permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Script ausfuehren
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python insider_watch.py

      # Zeitstempel wird IMMER aktualisiert (auch ohne neue Meldungen).
      # Nuetzlich, um auf einen Blick zu sehen, wann der letzte Lauf war.
      - name: Zeitstempel aktualisieren
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run.txt

      - name: Aenderungen zurueck ins Repo committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_entries.json last_run.txt
          git commit -m "Automatischer Lauf: $(date -u)"
          git pull --rebase
          git push
